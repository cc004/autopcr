services:
  openbao:
    profiles:
      - local

  openbao-init:
    profiles:
      - local

  openbao-bootstrap:
    profiles:
      - local

  autopcr:
    depends_on: !reset []
    environment:
      - AUTOPCR_OPENBAO_ADDR=${AUTOPCR_OPENBAO_ADDR:?Set AUTOPCR_OPENBAO_ADDR to the external OpenBao URL}
      - AUTOPCR_OPENBAO_AUTH_METHOD=${AUTOPCR_OPENBAO_AUTH_METHOD:-token}
      - AUTOPCR_OPENBAO_TOKEN_FILE=/run/openbao-external/app-token
      - AUTOPCR_OPENBAO_ROLE_ID=${AUTOPCR_OPENBAO_ROLE_ID:-}
      - AUTOPCR_OPENBAO_ROLE_ID_FILE=/run/openbao-external/role-id
      - AUTOPCR_OPENBAO_SECRET_ID_FILE=/run/openbao-external/secret-id
      - AUTOPCR_OPENBAO_APPROLE_MOUNT=${AUTOPCR_OPENBAO_APPROLE_MOUNT:-approle}
      - AUTOPCR_OPENBAO_K8S_ROLE=${AUTOPCR_OPENBAO_K8S_ROLE:-}
      - AUTOPCR_OPENBAO_K8S_MOUNT=${AUTOPCR_OPENBAO_K8S_MOUNT:-kubernetes}
      - AUTOPCR_OPENBAO_K8S_JWT_FILE=${AUTOPCR_OPENBAO_K8S_JWT_FILE:-/var/run/secrets/kubernetes.io/serviceaccount/token}
    volumes:
      - type: bind
        source: ${AUTOPCR_OPENBAO_EXTERNAL_CREDENTIALS_DIR:?Set AUTOPCR_OPENBAO_EXTERNAL_CREDENTIALS_DIR to a directory containing OpenBao credentials}
        target: /run/openbao-external
        read_only: true
