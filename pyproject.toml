[project]
authors = []
name = "autopcr"
requires-python = ">=3.10"
version = "0.1.0"
dependencies = [
    "aiohttp>=3.14.4,<4",
    "multidict>=6.9.1,<8",
    "aiofile>=3.9,<4",
    "gtlv>=0.1.4,<0.2",
    "certifi>=2026.10.19",
    "cryptography>=50.0.2,<51",
    "msgpack>=1.2.1,<2",
    "pycryptodome>=3.19.1,<4",
    "requests>=2.34.2,<3",
    "urllib3>=2.8,<3",
    "quart>=0.20,<0.21",
    "werkzeug>=3.1.9,<4",
    "h2>=4.4.1,<5",
    "pydantic>=1.10.26,<2",
    "jinja2>=3.1.6,<4",
    "markupsafe>=2.1.5,<4",
    "unitypy>=1.10.18,<1.11",
    "sqlalchemy>=2.0.17,<3",
    "pillow>=12.3,<13; python_version < \"3.11\"",
    "pillow>=13,<14; python_version >= \"3.11\"",
    "brotli>=1.2,<2",
    "quart-rate-limiter>=0.9,<0.10",
    "quart-auth>=0.11,<0.12",
    "quart-compress>=0.2.1,<0.3",
    "dataclasses-json>=0.6.7,<0.7",
    "pulp>=2.8,<3",
    "openpyxl>=3.1.5,<4",
    "networkx>=3.4.2",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.tasks]
download_web = { cmd = "python3 _download_web.py" }
server = { cmd = "python3 _httpserver_test.py" }

[tool.pixi.dependencies]
python = "3.10.*"
pixi-pycharm = ">=0.0.8,<0.0.9"

[tool.pixi.host-dependencies]
pkg-config = ">=0.29.2,<0.30"
